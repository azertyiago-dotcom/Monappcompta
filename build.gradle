buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.monentreprise.macompta'
    compileSdk 34

    defaultConfig {
        applicationId "com.monentreprise.macompta"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ['src/main/assets']
            res.srcDirs = ['src/main/res']
        }
    }

    androidResources {
        noCompress 'html', 'js', 'css'
    }

    // Évite les erreurs liées aux métadonnées de build
    buildFeatures {
        buildConfig true
    }
}

// ⚠️ Résolution du conflit Kotlin (kotlin-stdlib vs kotlin-stdlib-jdk7/jdk8)
configurations.all {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin'
                    && details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion '1.9.24'
            }
        }
    }
}

dependencies {
    // Contraintes explicites pour neutraliser les anciens modules jdk7/jdk8
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24') {
            because 'kotlin-stdlib-jdk7 est intégré dans kotlin-stdlib depuis 1.8.0'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24') {
            because 'kotlin-stdlib-jdk8 est intégré dans kotlin-stdlib depuis 1.8.0'
        }
    }

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
