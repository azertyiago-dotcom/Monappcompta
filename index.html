<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ma Compta</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding: 15px; padding-bottom: 40px; }
        .box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        h2 { font-size: 14px; color: #64748b; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; }
        label { display: block; font-size: 12px; font-weight: bold; margin: 8px 0 4px 0; color: #475569; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background: #f8fafc; margin-bottom: 5px; color: #000; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 5px; -webkit-appearance: none; }
        .btn-blue { background: #2563eb; color: white; }
        .btn-dark { background: #1e293b; color: white; }
        .btn-gray { background: #e2e8f0; color: #1e293b; }
        .btn-danger { background: #fee2e2; color: #991b1b; }
        .btn-green { background: #16a34a; color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; gap: 8px; }
        .item-row small { color: #64748b; }
        .btn-mini { width: auto; padding: 4px 8px; font-size: 11px; margin: 0 0 0 4px; border-radius: 4px; }
        .hidden { display: none !important; }
        .nav-tabs { display: flex; gap: 5px; background: #e2e8f0; padding: 3px; border-radius: 6px; margin-bottom: 10px; }
        .tab { flex: 1; text-align: center; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .tab.active { background: #2563eb; color: white; }
        .empty { text-align: center; color: #94a3b8; font-size: 12px; padding: 10px; font-style: italic; }
        .totals { margin-top: 10px; border-top: 1px dashed #cbd5e1; padding-top: 8px; font-size: 13px; }
        .totals > div { display: flex; justify-content: space-between; padding: 2px 0; }
        .totals .ttc { font-weight: bold; font-size: 15px; color: #166534; border-top: 1px solid #cbd5e1; padding-top: 6px; margin-top: 4px; }
        .bak-status { font-size: 12px; padding: 8px; border-radius: 6px; background: #f1f5f9; color: #475569; margin-bottom: 8px; }
        .bak-status.alerte { background: #fee2e2; color: #991b1b; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>🏢 Mon Établissement</h2>
    <label>Nom de l'entreprise</label>
    <input type="text" id="ent-name" oninput="saveProfil()">
    <label>SIRET</label>
    <input type="text" id="ent-siret" oninput="saveProfil()">
</div>

<div class="box" style="background: #f0fdf4;">
    <h2>📈 Bilan du Jour (TTC)</h2>
    <div style="font-size: 24px; font-weight: bold; color: #166534;" id="txt-ca">0.00 €</div>
</div>

<div class="box">
    <h2>💾 Sauvegarde des données</h2>
    <div id="bak-status" class="bak-status">...</div>
    <div class="grid">
        <button class="btn-green" onclick="sauvegarder()">💾 Sauvegarder</button>
        <button class="btn-gray" onclick="restaurer()">📥 Restaurer</button>
    </div>
</div>

<div class="box">
    <h2>🛒 Enregistrer un Article</h2>
    <div class="nav-tabs">
        <div id="t-stock" class="tab active" onclick="setMode(false)">Depuis Stock</div>
        <div id="t-libre" class="tab" onclick="setMode(true)">Saisie Directe</div>
    </div>

    <div id="v-stock">
        <label>Choisir le produit</label>
        <select id="sel-product" onchange="selectProd()"></select>
    </div>

    <div id="v-libre" class="hidden">
        <label>Nom de l'article</label>
        <input type="text" id="inp-name-libre" placeholder="Ex: Café ou Prestation">
    </div>

    <div class="grid3">
        <div>
            <label>Prix TTC (€)</label>
            <input type="number" id="inp-price" step="0.01" placeholder="0.00">
        </div>
        <div>
            <label>TVA (%)</label>
            <input type="number" id="inp-tva" step="0.1" value="20" min="0" max="100">
        </div>
        <div>
            <label>Qté</label>
            <input type="number" id="inp-qty" value="1" min="1">
        </div>
    </div>

    <button class="btn-gray" onclick="addPanier()">➕ Ajouter au panier</button>

    <div style="margin-top: 15px; border-top: 1px dashed #cbd5e1; padding-top: 10px;">
        <label>Panier Actuel :</label>
        <div id="liste-panier"></div>
        <div class="totals">
            <div><span>Total HT</span><span id="tot-ht">0.00 €</span></div>
            <div><span>Total TVA</span><span id="tot-tva">0.00 €</span></div>
            <div class="ttc"><span>TOTAL TTC</span><span id="tot-ttc">0.00 €</span></div>
        </div>
    </div>

    <label>Mode de paiement</label>
    <select id="sel-pay">
        <option value="Espèces">💵 Espèces</option>
        <option value="Chèque">✍️ Chèque</option>
        <option value="Carte (SumUp)">💳 Carte Bancaire (SumUp)</option>
    </select>

    <button class="btn-blue" onclick="encaisser()">🔒 Encaisser et Clôturer</button>
</div>

<div class="box">
    <h2>📦 Ajouter au Stock</h2>
    <label>Nom du produit</label>
    <input type="text" id="stk-name" placeholder="Ex: T-shirt XL">
    <div class="grid3">
        <div>
            <label>Prix Vente TTC (€)</label>
            <input type="number" id="stk-price" step="0.01" placeholder="0.00">
        </div>
        <div>
            <label>TVA (%)</label>
            <input type="number" id="stk-tva" step="0.1" value="20" min="0" max="100">
        </div>
        <div>
            <label>Quantité</label>
            <input type="number" id="stk-qty" placeholder="10">
        </div>
    </div>
    <button class="btn-dark" onclick="createStock()">Créer l'article</button>

    <label style="margin-top: 15px;">Inventaire Réel :</label>
    <div id="liste-stock"></div>
</div>

<div class="box">
    <h2>📜 Factures Clôturées</h2>
    <div id="liste-historique"></div>
    <button class="btn-danger" onclick="resetAll()" style="margin-top: 20px; font-size: 11px; padding: 6px;">⚠️ Tout Réinitialiser</button>
</div>

<script>
    // ---------- État ----------
    let stocks = [], ventes = [], panier = [];
    let profil = { name: "", siret: "" };
    let compteur = 0;            // dernier numéro de facture attribué (jamais remis à zéro)
    let isLibre = false;

    // ---------- Persistance ----------
    function loadAll() {
        try { stocks = JSON.parse(localStorage.getItem('stk_data')) || []; } catch(e) { stocks = []; }
        try { ventes = JSON.parse(localStorage.getItem('vnt_data')) || []; } catch(e) { ventes = []; }
        try { profil = JSON.parse(localStorage.getItem('prf_data')) || { name: "", siret: "" }; } catch(e) { profil = { name: "", siret: "" }; }
        try { compteur = parseInt(localStorage.getItem('cpt_data')) || 0; } catch(e) { compteur = 0; }
    }
    function saveStocks() { try { localStorage.setItem('stk_data', JSON.stringify(stocks)); } catch(e){ console.warn(e); } }
    function saveVentes() { try { localStorage.setItem('vnt_data', JSON.stringify(ventes)); } catch(e){ console.warn(e); } }
    function saveCompteur() { try { localStorage.setItem('cpt_data', String(compteur)); } catch(e){ console.warn(e); } }
    function saveProfil() {
        profil.name = document.getElementById('ent-name').value;
        profil.siret = document.getElementById('ent-siret').value;
        try { localStorage.setItem('prf_data', JSON.stringify(profil)); } catch(e){}
    }

    // ---------- Format ----------
    function fmt(n) { return Number(n).toFixed(2) + ' €'; }
    function esc(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // ---------- Confirmation fiable (Android natif si dispo) ----------
    function askConfirm(title, msg, ok, cancel, callback) {
        window.__confirmCb = callback;
        if (window.AndroidBridge && AndroidBridge.confirm) {
            AndroidBridge.confirm(title, msg, ok, cancel, "__confirmCb");
        } else {
            callback(window.confirm(title + "\n\n" + msg));
        }
    }

    // ---------- Mode ----------
    function setMode(mode) {
        isLibre = mode;
        document.getElementById('t-stock').className = mode ? "tab" : "tab active";
        document.getElementById('t-libre').className = mode ? "tab active" : "tab";
        document.getElementById('v-stock').className = mode ? "hidden" : "";
        document.getElementById('v-libre').className = mode ? "" : "hidden";
        document.getElementById('inp-price').value = "";
        if (!mode) selectProd();
    }

    function selectProd() {
        if (isLibre) return;
        const id = document.getElementById('sel-product').value;
        const item = stocks.find(p => p.id === id);
        if (item) {
            document.getElementById('inp-price').value = item.price;
            document.getElementById('inp-tva').value = item.tva;
        }
    }

    // ---------- Stock ----------
    function createStock() {
        const name = document.getElementById('stk-name').value.trim();
        const price = parseFloat(document.getElementById('stk-price').value);
        const tva = parseFloat(document.getElementById('stk-tva').value);
        const qty = parseInt(document.getElementById('stk-qty').value);

        if (!name || isNaN(price) || isNaN(qty) || isNaN(tva) || price < 0 || qty < 0 || tva < 0) {
            alert("Erreur : Veuillez remplir toutes les cases correctement.");
            return;
        }

        stocks.push({ id: "ID-" + Date.now(), name, price, tva, qty });
        document.getElementById('stk-name').value = "";
        document.getElementById('stk-price').value = "";
        document.getElementById('stk-tva').value = "20";
        document.getElementById('stk-qty').value = "";
        saveStocks();
        render();
    }

    // ---------- Panier ----------
    function addPanier() {
        const qty = parseInt(document.getElementById('inp-qty').value);
        const price = parseFloat(document.getElementById('inp-price').value);
        const tva = parseFloat(document.getElementById('inp-tva').value);

        if (isNaN(price) || isNaN(qty) || isNaN(tva) || qty < 1 || price < 0 || tva < 0) {
            alert("Indiquez un prix, une TVA et une quantité valides.");
            return;
        }

        let name, pId = "MANUEL";

        if (isLibre) {
            name = document.getElementById('inp-name-libre').value.trim();
            if (!name) { alert("Entrez le nom de l'article."); return; }
        } else {
            const id = document.getElementById('sel-product').value;
            const idx = stocks.findIndex(p => p.id === id);
            if (idx === -1) { alert("Sélectionnez un article."); return; }
            if (stocks[idx].qty < qty) { alert("Stock insuffisant."); return; }
            name = stocks[idx].name;
            pId = stocks[idx].id;
        }

        panier.push({ pId, name, qty, price, tva, total: price * qty });
        document.getElementById('inp-name-libre').value = "";
        document.getElementById('inp-price').value = "";
        document.getElementById('inp-qty').value = "1";
        render();
    }

    function removePanier(idx) {
        panier.splice(idx, 1);
        render();
    }

    // ---------- Totaux ----------
    function computeTotaux(list) {
        let ht = 0, tva = 0, ttc = 0;
        list.forEach(i => {
            const ttcLigne = i.price * i.qty;
            const htLigne = ttcLigne / (1 + (i.tva / 100));
            ttc += ttcLigne;
            ht  += htLigne;
            tva += (ttcLigne - htLigne);
        });
        return { ht, tva, ttc };
    }

    // ---------- Numérotation continue ----------
    // Format : FA-000001, FA-000002, ... Le compteur n'est jamais remis à zéro,
    // même après une réinitialisation, pour éviter tout doublon de numéro.
    function prochainNumero() {
        let max = compteur;
        ventes.forEach(v => {
            const m = /^FA-(\d+)$/.exec(v.id || "");
            if (m) max = Math.max(max, parseInt(m[1], 10));
        });
        return max + 1;
    }

    // ---------- Encaissement ----------
    function encaisser() {
        if (panier.length === 0) { alert("Votre panier est vide."); return; }

        const payMode = document.getElementById('sel-pay').value;

        panier.forEach(item => {
            if (item.pId !== "MANUEL") {
                const idx = stocks.findIndex(p => p.id === item.pId);
                if (idx !== -1) stocks[idx].qty -= item.qty;
            }
        });

        const t = computeTotaux(panier);
        const num = prochainNumero();
        compteur = num;
        const fRef = "FA-" + String(num).padStart(6, "0");
        const nouvelleVente = {
            id: fRef,
            num: num,
            date: new Date().toLocaleString('fr-FR'),
            dateTs: Date.now(),
            ht: t.ht,
            tva: t.tva,
            total: t.ttc,
            payment: payMode,
            profil: { name: profil.name, siret: profil.siret },
            items: panier.map(i => ({ name: i.name, qty: i.qty, price: i.price, tva: i.tva }))
        };

        ventes.push(nouvelleVente);
        panier = [];
        saveVentes();
        saveCompteur();
        saveStocks();
        render();
        alert("Facture " + fRef + " clôturée.\nTTC : " + fmt(t.ttc));
    }

    // ---------- Sauvegarde / Restauration ----------
    function buildBackup() {
        return JSON.stringify({
            app: "MaCompta", version: 1, date: new Date().toISOString(),
            compteur: compteur, profil: profil, stocks: stocks, ventes: ventes
        }, null, 1);
    }

    function marquerSauvegarde() {
        try { localStorage.setItem('bak_last', String(Date.now())); } catch(e){}
        renderBackupStatus();
    }

    function sauvegarder() {
        const nom = "MaCompta_sauvegarde_" + new Date().toISOString().slice(0, 10) + ".json";
        const data = buildBackup();
        if (window.AndroidBridge && AndroidBridge.saveBackup) {
            AndroidBridge.saveBackup(nom, data);   // résultat : window.__onBackupSaved
        } else {
            const a = document.createElement('a');   // test dans un navigateur
            a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
            a.download = nom;
            a.click();
            marquerSauvegarde();
        }
    }

    window.__onBackupSaved = function(ok) {
        if (ok) { marquerSauvegarde(); alert("Sauvegarde enregistrée.\nConservez-la ailleurs que sur ce téléphone (Drive, e-mail, ordinateur)."); }
        else { alert("Échec de la sauvegarde. Réessayez."); }
    };

    function restaurer() {
        if (window.AndroidBridge && AndroidBridge.pickBackup) {
            AndroidBridge.pickBackup();            // résultat : window.__onBackupLoaded
        } else {
            const inp = document.createElement('input');
            inp.type = 'file'; inp.accept = '.json,application/json';
            inp.onchange = () => {
                const f = inp.files[0]; if (!f) return;
                const r = new FileReader();
                r.onload = () => window.__onBackupLoaded(String(r.result));
                r.readAsText(f);
            };
            inp.click();
        }
    }

    window.__onBackupLoaded = function(text) {
        let d = null;
        try { d = text ? JSON.parse(text) : null; } catch(e) { d = null; }
        if (!d || d.app !== "MaCompta" || !Array.isArray(d.stocks) || !Array.isArray(d.ventes)) {
            alert("Fichier invalide : ce n'est pas une sauvegarde Ma Compta.");
            return;
        }
        const jour = d.date ? new Date(d.date).toLocaleString('fr-FR') : "date inconnue";
        askConfirm("Restaurer la sauvegarde ?",
            "Sauvegarde du " + jour + " : " + d.ventes.length + " facture(s), " + d.stocks.length + " article(s).\n\n" +
            "Les données actuelles seront REMPLACÉES.",
            "Restaurer", "Annuler", (ok) => {
                if (!ok) return;
                stocks = d.stocks;
                ventes = d.ventes;
                profil = d.profil && typeof d.profil === 'object' ? d.profil : { name: "", siret: "" };
                // On garde le plus grand compteur pour ne jamais réutiliser un numéro déjà émis
                compteur = Math.max(compteur, parseInt(d.compteur) || 0);
                panier = [];
                saveStocks(); saveVentes(); saveCompteur();
                try { localStorage.setItem('prf_data', JSON.stringify(profil)); } catch(e){}
                marquerSauvegarde();
                render();
                alert("Sauvegarde restaurée.");
            });
    };

    function renderBackupStatus() {
        const el = document.getElementById('bak-status');
        let last = 0;
        try { last = parseInt(localStorage.getItem('bak_last')) || 0; } catch(e){}
        if (!last) {
            el.textContent = ventes.length ? "⚠️ Aucune sauvegarde effectuée : vos données sont uniquement sur ce téléphone." : "Aucune sauvegarde pour l'instant.";
            el.className = "bak-status" + (ventes.length ? " alerte" : "");
            return;
        }
        const depuis = ventes.filter(v => (v.dateTs || 0) > last).length;
        el.textContent = "Dernière sauvegarde : " + new Date(last).toLocaleString('fr-FR') +
            (depuis ? " — ⚠️ " + depuis + " facture(s) depuis" : " — à jour");
        el.className = "bak-status" + (depuis ? " alerte" : "");
    }

    // ---------- Reset ----------
    function resetAll() {
        askConfirm("Réinitialiser ?",
            "Supprimer TOUTES les données (stock, ventes, profil) ?\nLe compteur de numérotation des factures est conservé.\nAction irréversible.",
            "Oui, supprimer", "Annuler", (ok) => {
                if (!ok) return;
                askConfirm("Confirmation finale",
                    "Vraiment sûr ? Faites une sauvegarde avant.",
                    "Confirmer", "Annuler", (ok2) => {
                        if (!ok2) return;
                        stocks = []; ventes = []; panier = []; profil = { name: "", siret: "" };
                        try {
                            localStorage.removeItem('stk_data');
                            localStorage.removeItem('vnt_data');
                            localStorage.removeItem('prf_data');
                            // 'cpt_data' est volontairement conservé (numérotation continue)
                        } catch(e){}
                        document.getElementById('ent-name').value = "";
                        document.getElementById('ent-siret').value = "";
                        render();
                        if (window.AndroidBridge && AndroidBridge.toast) AndroidBridge.toast("Données effacées");
                    });
            });
    }

    // ---------- Export PDF ----------
    function buildFactureHtml(v) {
        const rows = v.items.map(i => {
            const ttc = i.price * i.qty;
            const ht = ttc / (1 + i.tva / 100);
            return `<tr>
                <td>${esc(i.name)}</td>
                <td style="text-align:center">${i.qty}</td>
                <td style="text-align:right">${fmt(i.price)}</td>
                <td style="text-align:center">${i.tva}%</td>
                <td style="text-align:right">${fmt(ht)}</td>
                <td style="text-align:right">${fmt(ttc)}</td>
            </tr>`;
        }).join('');

        return `<!DOCTYPE html><html><head><meta charset="UTF-8">
        <style>
            body{font-family:sans-serif;padding:20px;font-size:12px;color:#1e293b}
            h1{font-size:20px;margin-bottom:4px}
            .hdr{display:flex;justify-content:space-between;border-bottom:2px solid #2563eb;padding-bottom:10px;margin-bottom:15px}
            .hdr .right{text-align:right}
            table{width:100%;border-collapse:collapse;margin-top:10px}
            th{background:#f1f5f9;padding:6px;text-align:left;font-size:11px;border-bottom:1px solid #cbd5e1}
            td{padding:6px;border-bottom:1px solid #e2e8f0}
            .tot{margin-top:15px;text-align:right;font-size:13px}
            .tot div{padding:3px 0}
            .tot .ttc{font-weight:bold;font-size:15px;color:#166534;border-top:1px solid #cbd5e1;padding-top:6px}
            .footer{margin-top:30px;font-size:10px;color:#94a3b8;text-align:center}
        </style></head><body>
        <div class="hdr">
            <div><h1>${esc(v.profil.name || "Mon Établissement")}</h1>
                <div>SIRET : ${esc(v.profil.siret || "—")}</div></div>
            <div class="right"><h1>Facture ${esc(v.id)}</h1>
                <div>${esc(v.date)}</div>
                <div>Paiement : ${esc(v.payment)}</div></div>
        </div>
        <table>
            <thead><tr>
                <th>Désignation</th><th style="text-align:center">Qté</th>
                <th style="text-align:right">P.U. TTC</th><th style="text-align:center">TVA</th>
                <th style="text-align:right">HT</th><th style="text-align:right">TTC</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
        <div class="tot">
            <div>Total HT : ${fmt(v.ht)}</div>
            <div>Total TVA : ${fmt(v.tva)}</div>
            <div class="ttc">TOTAL TTC : ${fmt(v.total)}</div>
        </div>
        <div class="footer">Facture générée par Ma Compta</div>
        </body></html>`;
    }

    function exportPdf(id) {
        const v = ventes.find(x => x.id === id);
        if (!v) { alert("Facture introuvable"); return; }
        if (!window.AndroidBridge || !AndroidBridge.exportPdfAndShare) {
            alert("Export PDF disponible uniquement dans l'application Android.");
            return;
        }
        // Ouvre la boîte d'impression Android : « Enregistrer au format PDF », partage ou imprimante
        AndroidBridge.exportPdfAndShare(buildFactureHtml(v), "Facture_" + v.id + ".pdf");
    }

    // ---------- Rendu ----------
    function render() {
        document.getElementById('ent-name').value = profil.name || "";
        document.getElementById('ent-siret').value = profil.siret || "";

        // CA du jour
        const today = new Date().toLocaleDateString('fr-FR');
        const ca = ventes
            .filter(v => v.dateTs ? new Date(v.dateTs).toLocaleDateString('fr-FR') === today
                                  : (v.date && v.date.startsWith(today)))
            .reduce((s, v) => s + v.total, 0);
        document.getElementById('txt-ca').textContent = fmt(ca);

        renderBackupStatus();

        // Sélecteur produits
        const sel = document.getElementById('sel-product');
        const prev = sel.value;
        if (stocks.length === 0) {
            sel.innerHTML = '<option value="">— Aucun article en stock —</option>';
        } else {
            sel.innerHTML = stocks.map(p =>
                `<option value="${esc(p.id)}">${esc(p.name)} — ${fmt(p.price)} (x${p.qty})</option>`
            ).join('');
            if (prev && stocks.some(p => p.id === prev)) sel.value = prev;
            if (!isLibre && !document.getElementById('inp-price').value) selectProd();
        }

        // Panier
        const lp = document.getElementById('liste-panier');
        if (panier.length === 0) {
            lp.innerHTML = '<div class="empty">Panier vide</div>';
        } else {
            lp.innerHTML = panier.map((i, idx) => `
                <div class="item-row">
                    <span>${esc(i.name)} <small>x${i.qty} — TVA ${i.tva}%</small></span>
                    <span>${fmt(i.total)}
                        <button class="btn-danger btn-mini" onclick="removePanier(${idx})">✕</button>
                    </span>
                </div>`).join('');
        }
        const tp = computeTotaux(panier);
        document.getElementById('tot-ht').textContent  = fmt(tp.ht);
        document.getElementById('tot-tva').textContent = fmt(tp.tva);
        document.getElementById('tot-ttc').textContent = fmt(tp.ttc);

        // Stock
        const ls = document.getElementById('liste-stock');
        if (stocks.length === 0) {
            ls.innerHTML = '<div class="empty">Aucun article</div>';
        } else {
            ls.innerHTML = stocks.map(p => `
                <div class="item-row">
                    <span>${esc(p.name)} <small>— ${fmt(p.price)} — TVA ${p.tva}%</small></span>
                    <span>Stock : <strong>${p.qty}</strong></span>
                </div>`).join('');
        }

        // Historique
        const lh = document.getElementById('liste-historique');
        if (ventes.length === 0) {
            lh.innerHTML = '<div class="empty">Aucune facture</div>';
        } else {
            lh.innerHTML = ventes.slice().reverse().map(v => `
                <div class="item-row">
                    <span><strong>${esc(v.id)}</strong><br>
                        <small>${esc(v.date)} — ${esc(v.payment)}<br>
                        HT ${fmt(v.ht)} / TVA ${fmt(v.tva)}</small></span>
                    <span style="text-align:right">
                        <strong>${fmt(v.total)}</strong><br>
                        <button class="btn-dark btn-mini" onclick="exportPdf('${esc(v.id)}')">📄 PDF</button>
                    </span>
                </div>`).join('');
        }
    }

    // ---------- Boot ----------
    loadAll();
    render();
</script>
</body>
</html>
