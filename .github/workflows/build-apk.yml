
name: Générateur Automatique APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Récupération du code
      uses: actions/checkout@v4

    - name: 2. Installation de Java (Requis pour Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 3. Installation de Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 4. Installation des outils Capacitor
      run: npm install

    - name: 5. Préparation du dossier Web obligatoires
      run: |
        mkdir www
        cp index.html www/

    - name: 6. Création du dossier Android
      run: npx cap add android

    - name: 7. Synchronisation des fichiers
      run: npx cap sync

    - name: 8. Compilation du fichier APK final
      run: |
        cd android
        ./gradlew assembleDebug

    - name: 9. Mise à disposition de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Mon-Application-Compta-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
