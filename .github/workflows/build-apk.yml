name: Générateur Automatique APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Récupération du code
      uses: actions/checkout@v4

    - name: 2. Configuration de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 3. Génération de l'architecture Native Android Pure
      run: |
        mkdir -p src/main/assets
        mkdir -p src/main/res/values
        
        # Transfert direct du fichier HTML de gestion
        cp index.html src/main/assets/index.html
        
        # Création des configurations de chaînes indispensables
        echo '<resources><string name="app_name">Ma Compta</string></resources>' > src/main/res/values/strings.xml

        # Écriture brute et isolée du Manifeste de Sécurité sans interférence Linux
        echo '<manifest xmlns:android="http://android.com">' > src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.INTERNET" />' >> src/main/AndroidManifest.xml
        echo '    <queries>' >> src/main/AndroidManifest.xml
        echo '        <package android:name="com.sumup.merchant" />' >> src/main/AndroidManifest.xml
        echo '    </queries>' >> src/main/AndroidManifest.xml
        echo '    <application' >> src/main/AndroidManifest.xml
        echo '        android:label="@string/app_name"' >> src/main/AndroidManifest.xml
        echo '        android:allowBackup="true"' >> src/main/AndroidManifest.xml
        echo '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar">' >> src/main/AndroidManifest.xml
        echo '        <activity android:name="com.monentreprise.macompta.MainActivity"' >> src/main/AndroidManifest.xml
        echo '            android:exported="true">' >> src/main/AndroidManifest.xml
        echo '            <intent-filter>' >> src/main/AndroidManifest.xml
        echo '                <action android:name="android.intent.action.MAIN" />' >> src/main/AndroidManifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER" />' >> src/main/AndroidManifest.xml
        echo '            </intent-filter>' >> src/main/AndroidManifest.xml
        echo '        </activity>' >> src/main/AndroidManifest.xml
        echo '    </application>' >> src/main/AndroidManifest.xml
        echo '</manifest>' >> src/main/AndroidManifest.xml

        # Configuration de la classe principale d'exécution native
        mkdir -p src/main/java/com/monentreprise/macompta
        echo "package com.monentreprise.macompta;" > src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "import android.app.Activity;" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "import android.os.Bundle;" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "import android.webkit.WebSettings;" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "import android.webkit.WebView;" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "import android.webkit.WebViewClient;" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "public class MainActivity extends Activity {" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "    @Override" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "    protected void onCreate(Bundle savedInstanceState) {" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "        super.onCreate(savedInstanceState);" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "        WebView webView = new WebView(this);" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "        WebSettings settings = webView.getSettings();" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "        settings.setJavaScriptEnabled(true);" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "        settings.setDomStorageEnabled(true);" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "        settings.setDatabaseEnabled(true);" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "        settings.setAllowFileAccess(true);" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "        webView.setWebViewClient(new WebViewClient());" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "        webView.loadUrl(\"file:///android_asset/index.html\");" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "        setContentView(webView);" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "    }" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "}" >> src/main/java/com/monentreprise/macompta/MainActivity.java

        # Forçage de l'arborescence
        echo "" > settings.gradle

    - name: 4. Configuration officielle de Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2.1'

    - name: 5. Compilation de l'APK Natif Final
      run: gradle assembleDebug

    - name: 6. Livraison de l'APK fonctionnel
      uses: actions/upload-artifact@v4
      with:
        name: Mon-Application-Compta-APK
        path: build/outputs/apk/debug/*.apk
