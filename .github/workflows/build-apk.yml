name: Générateur Automatique APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Récupération du code
      uses: actions/checkout@v4

    - name: 2. Configuration de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 3. Génération de l'architecture Native Android Pure
      run: |
        mkdir -p src/main/assets
        mkdir -p src/main/res/values
        
        # Transfert direct du fichier HTML de gestion
        cp index.html src/main/assets/index.html
        
        # Création des configurations de chaînes indispensables
        echo '<resources><string name="app_name">Ma Compta</string></resources>' > src/main/res/values/strings.xml

        # Écriture brute et sécurisée du Manifeste sans interférence textuelle
        cat << 'EOF' > src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <queries>
                <package android:name="com.sumup.merchant" />
            </queries>
            <application
                android:label="@string/app_name"
                android:allowBackup="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity android:name="com.monentreprise.macompta.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Configuration de la classe principale d'exécution native
        mkdir -p src/main/java/com/monentreprise/macompta
        cat << 'EOF' > src/main/java/com/monentreprise/macompta/MainActivity.java
        package com.monentreprise.macompta;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setAllowFileAccess(true);
                
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF

        # Nettoyage et forçage de l'indexation unique de l'arborescence
        echo "" > settings.gradle

    - name: 4. Configuration officielle de Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2.1'

    - name: 5. Compilation de l'APK Natif Final
      run: gradle assembleDebug

    - name: 6. Livraison de l'APK fonctionnel
      uses: actions/upload-artifact@v4
      with:
        name: Mon-Application-Compta-APK
        path: build/outputs/apk/debug/*.apk
