name: Générateur Automatique APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Récupération du code
      uses: actions/checkout@v4

    - name: 2. Configuration de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 3. Génération de l'architecture Native Android Pure
      run: |
        mkdir -p src/main/assets
        mkdir -p src/main/res/values
        mkdir -p src/main/java/com/monentreprise/macompta
        
        # Transfert direct et sécurisé des fichiers d'origine sans altération
        cp index.html src/main/assets/index.html
        cp AndroidManifest.xml src/main/AndroidManifest.xml
        
        # Désactivation de l'indexation double de l'arborescence
        echo "" > settings.gradle

    - name: 4. Création propre des chaînes de texte
      uses: jakejarvis/lighthouse-action@master
      with:
        custom_config: |
          <resources><string name="app_name">Ma Compta</string></resources>
      continue-on-error: true

    - name: 4bis. Écriture forcée des ressources textuelles
      run: echo '<resources><string name="app_name">Ma Compta</string></resources>' > src/main/res/values/strings.xml

    - name: 5. Génération sécurisée de la classe MainActivity
      uses: native-actions/copy-file@v1
      with:
        content: |
          package com.monentreprise.macompta;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
        dest: src/main/java/com/monentreprise/macompta/MainActivity.java
      continue-on-error: true

    - name: 5bis. Création de secours de l'activité native
      run: |
        echo "package com.monentreprise.macompta;" > src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "import android.app.Activity; import android.os.Bundle; import android.webkit.WebSettings; import android.webkit.WebView; import android.webkit.WebViewClient;" >> src/main/java/com/monentreprise/macompta/MainActivity.java
        echo "public class MainActivity extends Activity { protected void onCreate(Bundle s) { super.onCreate(s); WebView w = new WebView(this); WebSettings g = w.getSettings(); g.setJavaScriptEnabled(true); g.setDomStorageEnabled(true); g.setDatabaseEnabled(true); g.setAllowFileAccess(true); w.setWebViewClient(new WebViewClient()); w.loadUrl(\"file:///android_asset/index.html\"); setContentView(w); } }" >> src/main/java/com/monentreprise/macompta/MainActivity.java

    - name: 6. Configuration officielle de Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2.1'

    - name: 7. Compilation de l'APK Natif Final
      run: gradle assembleDebug

    - name: 8. Livraison de l'APK fonctionnel
      uses: actions/upload-artifact@v4
      with:
        name: Mon-Application-Compta-APK
        path: build/outputs/apk/debug/*.apk
