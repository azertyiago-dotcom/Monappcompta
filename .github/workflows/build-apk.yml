name: Générateur Automatique APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Récupération du code
      uses: actions/checkout@v4

    - name: 2. Configuration de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 3. Génération de l'architecture Native Android
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/values
        cp index.html app/src/main/assets/index.html
        
        # Création des textes
        echo '<resources><string name="app_name">Ma Compta</string></resources>' > app/src/main/res/values/strings.xml
        
        # Création du manifeste de sécurité avec accès aux requêtes SumUp
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <queries>
                <package android:name="com.sumup.merchant" />
            </queries>
            <application
                android:label="@string/app_name"
                android:allowBackup="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity android:name="com.monentreprise.macompta.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Création du code natif
        mkdir -p app/src/main/java/com/monentreprise/macompta
        cat << 'EOF' > app/src/main/java/com/monentreprise/macompta/MainActivity.java
        package com.monentreprise.macompta;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setAllowFileAccess(true);
                
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF

        # Configuration des fichiers de construction
        cp build.gradle app/build.gradle
        echo "include ':app'" > settings.gradle

    - name: 4. Installation forcée de Gradle 8.2
      run: |
        wget https://gradle.org
        unzip -q gradle-8.2-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-8.2/bin" >> $GITHUB_PATH

    - name: 5. Compilation de l'APK Natif
      run: gradle assembleDebug

    - name: 6. Livraison de l'APK fonctionnel
      uses: actions/upload-artifact@v4
      with:
        name: Mon-Application-Compta-APK
        path: app/build/outputs/apk/debug/app-debug.apk
